
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026大阪員工旅遊報到系統!!!</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 400px;
margin: 60px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000010;
    }
    h2 { color: #222; }
    #status { color: #555; line-height: 1.8; }
  </style>
</head>
<body>
  
<div class="card" style="margin:12px auto;padding:12px 16px;">

    
    
    <div id="status">正在連接 LINE...</div>
    

<div id="bindingForm" style="display:none; margin-top:24px;">
  

  <input id="bindingCode" type="text"
    placeholder="請輸入一次性綁定碼"
    autocomplete="off"
    style="width:100%;box-sizing:border-box;padding:12px;margin-bottom:12px;">

  <button id="bindButton" type="button" disabled
    style="padding:12px 24px;width:100%;">
    確認綁定
  </button>

  <div id="bindingResult" role="status" style="margin-top:12px;"></div>
</div>




</div>




  <script>
    async function start() {
      const status = document.getElementById('status');

      try {
        await liff.init({
          liffId: '2012700631-6EXM2Hfo'
        });

        if (!liff.isLoggedIn()) {
          status.textContent = 'LINE 尚未登入';
          return;
        }

        const profile = await liff.getProfile();

        status.textContent =
          'LINE 連線成功！使用者：' + profile.displayName;
document.getElementById('bindingForm').style.display = 'block';
document.getElementById('bindButton').disabled = false;
        
await loadCheckinStatus();

await loadAdminDashboard();

      } catch (err) {
        status.textContent =
          'LINE 初始化失敗：' + (err.message || String(err));
      }
    }

    start();
  </script>

<script>
async function testAPI() {
  const result = document.getElementById('apiResult');

  result.textContent = '正在測試 API...';

  try {
    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/'
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    result.textContent = data.success
      ? 'API 連線成功：' + data.message
      : 'API 回應失敗';

  } catch (error) {
    result.textContent = 'API 連線失敗：' + error.message;
  }
}
</script>
  
<script>
document.getElementById('bindButton').addEventListener('click', async function () {
  const button = document.getElementById('bindButton');
  const result = document.getElementById('bindingResult');
  
  const bindingCode = document.getElementById('bindingCode').value.trim();

  if (!bindingCode) {
    result.textContent = '請輸入一次性綁定碼';
    return;
  }

  button.disabled = true;
  result.textContent = '正在驗證員工資料...';

  try {
    if (!liff.isLoggedIn()) {
      throw new Error('LINE 尚未登入');
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error('無法取得 LINE 身分憑證，請確認 LIFF 已啟用 openid 權限');
    }

    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/bind',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          idToken: idToken,
          
          bindingCode: bindingCode
        })
      }
    );

    const data = await response.json();

    if (!response.ok || data.success !== true) {
      throw new Error(data.message || '綁定失敗');
    }

    result.textContent = '綁定成功：' + data.employeeName;
    document.getElementById('bindingForm').style.display = 'none';
    alert('員工 LINE 綁定成功');

  } catch (error) {
    result.textContent = '綁定失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>

<div id="checkinPanel" style="display:none;max-width:440px;margin:20px auto;padding:20px;background:white;border-radius:16px;">
  <h2>2026 大阪員工旅遊</h2>
  <p id="employeeInfo">正在讀取員工資料...</p>
  <div id="sessionList"></div>
  <p id="checkinMessage" role="status"></p>
</div>

<script>
async function loadCheckinStatus() {
  const panel = document.getElementById('checkinPanel');
  const info = document.getElementById('employeeInfo');
  const list = document.getElementById('sessionList');
  const message = document.getElementById('checkinMessage');

  panel.style.display = 'block';
  info.textContent = '正在查詢報到資料...';
  list.replaceChildren();
  message.textContent = '';

  try {
    const idToken = liff.getIDToken();
    if (!idToken) {
      throw new Error('無法取得 LINE 登入憑證');
    }

    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/status',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      }
    );

    const data = await response.json();

    if (!response.ok || data.success !== true) {
      info.textContent = '尚未取得員工報到資料';
      message.textContent = data.message || '查詢失敗';
      return;
    }

    info.textContent = '員工：' + data.employeeName;

    document.getElementById('bindingForm').style.display = 'none';

    for (const session of data.sessions) {
      const item = document.createElement('div');
      item.style.cssText =
        'padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:12px;text-align:left';

      const name = document.createElement('strong');
      name.textContent = session.sessionName;

      const status = document.createElement('p');
      status.textContent = session.checkedIn
        ? '已報到'
        : session.isOpen
          ? '開放報到中'
          : '尚未開放';

      item.append(name, status);
      
if (session.isOpen && !session.checkedIn) {
  const button = document.createElement('button');
  button.textContent = '確認報到';
  button.style.cssText =
    'width:100%;padding:14px;border:0;border-radius:10px;background:#06c755;color:white;font-size:16px;cursor:pointer';

  button.addEventListener('click', async () => {
    if (!confirm('確定要完成此場次報到嗎？')) return;

    button.disabled = true;
    button.textContent = '報到處理中...';

    try {
      const idToken = liff.getIDToken();
      if (!idToken) throw new Error('LINE 登入憑證無效');

      const response = await fetch(
        'https://employee-checkin-api.platonic2568.workers.dev/checkin',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idToken,
            sessionId: session.sessionId
          })
        }
      );

      const result = await response.json();

      if (!response.ok || result.success !== true) {
        throw new Error(result.message || '報到失敗');
      }

      message.textContent = '報到成功：' + session.sessionName;
      await loadCheckinStatus();
    } catch (error) {
      message.textContent = error.message || '報到失敗';
      button.disabled = false;
      button.textContent = '確認報到';
    }
  });

  item.appendChild(button);
}

      list.appendChild(item);
    }
  } catch (error) {
    info.textContent = '報到資料讀取失敗';
    message.textContent = '請重新開啟系統或聯絡管理員';
  }
}
</script>

<div id="adminPanel" style="display:none;max-width:440px;margin:20px auto;padding:20px;background:white;border-radius:16px;">
  <h2>管理員點名總覽</h2>
  <p>2026 大阪員工旅遊</p>
  <div id="adminSessionList"></div>
  <p id="adminMessage" role="status"></p>
</div>

<script>
async function loadAdminDashboard() {
  const panel = document.getElementById('adminPanel');
  const list = document.getElementById('adminSessionList');
  const message = document.getElementById('adminMessage');

  panel.style.display = 'none';
  list.replaceChildren();
  message.textContent = '';

  try {
    const idToken = liff.getIDToken();
    if (!idToken) return;

    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/admin',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      }
    );

    const data = await response.json();

    if (!response.ok || data.success !== true ||
        !Array.isArray(data.sessions)) {
      return;
    }

    for (const session of data.sessions) {
      const card = document.createElement('div');
      card.style.cssText =
        'padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:12px;text-align:left';

      const title = document.createElement('h3');
      title.textContent = session.sessionName;

      const counts = document.createElement('p');
      counts.textContent =
        '應到 ' + session.total +
        '｜已到 ' + session.checkedIn +
        '｜未到 ' + session.notCheckedIn;

      card.append(title, counts);

const controlButton = document.createElement('button');
const isOpen = session.sessionStatus === '開放';
const newStatus = isOpen ? '未開放' : '開放';

controlButton.textContent = isOpen ? '關閉報到' : '開放報到';
controlButton.style.cssText =
  'width:100%;padding:12px;margin:10px 0;border:0;border-radius:10px;background:#06c755;color:white;font-size:16px;cursor:pointer';

controlButton.addEventListener('click', async () => {
  if (!confirm('確定要' + controlButton.textContent + '嗎？')) return;

  controlButton.disabled = true;
  controlButton.textContent = '處理中...';

  try {
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error('LINE 登入憑證無效');

    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/sessionControl',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idToken,
          sessionId: session.sessionId,
          newStatus
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.success !== true) {
      throw new Error(result.message || '操作失敗');
    }

    await loadAdminDashboard();
    await loadCheckinStatus();
  } catch (error) {
    alert(error.message || '操作失敗');
    controlButton.disabled = false;
    controlButton.textContent = isOpen ? '關閉報到' : '開放報到';
  }
});

card.appendChild(controlButton);

      
const checkedIn = session.employees.filter(
  employee => employee.status === '已報到'
);

const notCheckedIn = session.employees.filter(
  employee => employee.status === '未報到'
);

function addEmployeeGroup(title, employees, color) {
  const heading = document.createElement('h4');
  heading.textContent = title + '（' + employees.length + '人）';
  heading.style.color = color;
  heading.style.marginBottom = '8px';
  card.appendChild(heading);

  if (employees.length === 0) {
    const empty = document.createElement('p');
    empty.textContent = '無';
    card.appendChild(empty);
    return;
  }

  for (const employee of employees) {
    const row = document.createElement('p');
    row.textContent = employee.employeeName;
    row.style.color = color;
    row.style.margin = '6px 0';
    card.appendChild(row);
  }
}

addEmployeeGroup('已報到名單', checkedIn, '#16A34A');
addEmployeeGroup('未報到名單', notCheckedIn, '#DC2626');


      list.appendChild(card);
    }

    panel.style.display = 'block';
  } catch (error) {
    console.error('管理員資料查詢失敗');
  }
}
</script>

</body>
</html>
