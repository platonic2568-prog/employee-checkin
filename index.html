
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>員工旅遊報到系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      margin: 60px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000010;
    }
    h2 { color: #222; }
    #status { color: #555; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>員工旅遊報到系統</h2>
    <p>LINE 身分驗證測試</p>
    <div id="status">正在連接 LINE...</div>
    <button type="button" onclick="testAPI()" style="margin-top:20px;padding:12px 20px;">
  測試 API 連線
</button>
<div id="apiResult" style="margin-top:15px;"></div>

<div id="bindingForm" style="display:none; margin-top:24px;">
  <input id="employeeId" type="text"
    placeholder="請輸入員工編號"
    autocomplete="off"
    style="width:100%;box-sizing:border-box;padding:12px;margin-bottom:12px;">

  <input id="bindingCode" type="text"
    placeholder="請輸入一次性綁定碼"
    autocomplete="off"
    style="width:100%;box-sizing:border-box;padding:12px;margin-bottom:12px;">

  <button id="bindButton" type="button" disabled
    style="padding:12px 24px;width:100%;">
    確認綁定
  </button>

  <div id="bindingResult" role="status" style="margin-top:12px;"></div>
</div>




</div>




  <script>
    async function start() {
      const status = document.getElementById('status');

      try {
        await liff.init({
          liffId: '2012700631-6EXM2Hfo'
        });

        if (!liff.isLoggedIn()) {
          status.textContent = 'LINE 尚未登入';
          return;
        }

        const profile = await liff.getProfile();

        status.textContent =
          'LINE 連線成功！使用者：' + profile.displayName;
document.getElementById('bindingForm').style.display = 'block';
document.getElementById('bindButton').disabled = false;        
      } catch (err) {
        status.textContent =
          'LINE 初始化失敗：' + (err.message || String(err));
      }
    }

    start();
  </script>

<script>
async function testAPI() {
  const result = document.getElementById('apiResult');

  result.textContent = '正在測試 API...';

  try {
    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/'
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    result.textContent = data.success
      ? 'API 連線成功：' + data.message
      : 'API 回應失敗';

  } catch (error) {
    result.textContent = 'API 連線失敗：' + error.message;
  }
}
</script>
  
<script>
document.getElementById('bindButton').addEventListener('click', async function () {
  const button = document.getElementById('bindButton');
  const result = document.getElementById('bindingResult');
  const employeeId = document.getElementById('employeeId').value.trim();
  const bindingCode = document.getElementById('bindingCode').value.trim();

  if (!employeeId || !bindingCode) {
    result.textContent = '請輸入員工編號及一次性綁定碼';
    return;
  }

  button.disabled = true;
  result.textContent = '正在驗證員工資料...';

  try {
    if (!liff.isLoggedIn()) {
      throw new Error('LINE 尚未登入');
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error('無法取得 LINE 身分憑證，請確認 LIFF 已啟用 openid 權限');
    }

    const response = await fetch(
      'https://employee-checkin-api.platonic2568.workers.dev/bind',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          idToken: idToken,
          employeeId: employeeId,
          bindingCode: bindingCode
        })
      }
    );

    const data = await response.json();

    if (!response.ok || data.success !== true) {
      throw new Error(data.message || '綁定失敗');
    }

    result.textContent = '綁定成功：' + data.employeeName;
    document.getElementById('bindingForm').style.display = 'none';
    alert('員工 LINE 綁定成功');

  } catch (error) {
    result.textContent = '綁定失敗：' + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
